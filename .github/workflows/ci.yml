name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # GitHub's macOS runners are VMs with paravirtualised Metal; MLX GPU work
  # aborts there with an AppleParavirtCommandBuffer assertion (SIGABRT), which
  # kills the whole test binary. The fixtures are device-independent, so the
  # CPU backend gives identical numbers.
  MLX_WHISPER_RS_TEST_CPU: "1"

jobs:
  build:
    # Apple Silicon. mlx-sys links Foundation/objc/Metal/Accelerate
    # unconditionally, so this crate cannot build anywhere else. For macOS the
    # *unsuffixed* labels are the arm64 ones; `macos-15-intel` and
    # `macos-26-intel` are the x86 variants and would fail in the MLX build.
    #
    # macos-14 began deprecation on 2026-07-06 and is fully unsupported after
    # 2026-11-02 (actions/runner-images#13518), so this is pinned forward
    # rather than to `macos-latest`, which still resolves to macos-15 and would
    # move under us on GitHub's schedule instead of ours.
    runs-on: macos-26
    # The first build compiles MLX from source: mlx-sys cmake-builds its
    # vendored mlx-c with MLX_C_USE_SYSTEM_MLX=OFF, which makes CMake clone
    # ml-explore/mlx v0.25.1 and build it in-tree. Budget accordingly; later
    # runs hit the cache.
    timeout-minutes: 90

    # Actions are pinned to full commit SHAs, not tags. A tag is mutable:
    # whoever controls the action's repo can repoint `v7` at new code, which
    # would run with this workflow's token without any change here. The
    # trailing comment records the human-readable version, and dependabot
    # (.github/dependabot.yml) keeps both halves in step.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          echo "arch: $(uname -m)"
          sw_vers
          cmake --version
          rustc --version
          cargo --version
          xcodebuild -version || true

      - name: Cache cargo registry and git checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-26-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-26-arm64-cargo-

      # The compiled MLX lives in target/**/build/mlx-sys-*/out, so caching
      # target/ is what actually saves the 10-20 minute rebuild. Keyed on
      # Cargo.lock so a dependency bump invalidates it.
      #
      # The image label is in the key, not `${{ runner.os }}`, which is just
      # "macOS" for every version. Without it, C++ objects built against the
      # macOS 14 SDK by Xcode 15.4 would be restored onto a macOS 26 runner
      # with Clang 21 — a stale-artifact link failure that would look like a
      # code problem. Bump the label here whenever `runs-on` moves.
      - name: Cache build directory (contains the compiled MLX)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: macos-26-arm64-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-26-arm64-target-

      # The single most important signal: does the crate, and do the tests,
      # actually compile? Separated from the test run so a compile failure is
      # never confused with a test failure.
      - name: Build library and examples
        run: cargo build --verbose --lib --examples

      - name: Build tests (compile only)
        run: cargo test --no-run --verbose

      # The segmentation fixture is the one golden that needs no mlx, so CI can
      # cheaply confirm it still matches its generator. A fixture that has
      # drifted from the reference it claims to come from proves nothing.
      - name: Check the segmentation fixture is current
        run: |
          python3 tools/reference_segmentation.py
          git diff --exit-code tests/fixtures/segmentation.json

      - name: Populate tokenizer assets
        run: |
          python3 -m pip install --user --quiet --break-system-packages numpy
          python3 tools/extract_assets.py --version 0.4.3
          ls -la assets/

      - name: Report Metal availability
        # GitHub's macOS runners are VMs; if Metal is unavailable the tests
        # will say so here rather than failing with an opaque MLX error.
        run: |
          system_profiler SPDisplaysDataType 2>/dev/null | head -20 || true

      - name: Run tests
        id: tests
        run: cargo test --verbose -- --nocapture

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Result"
            echo ""
            echo "- build (lib + examples): **${{ job.status }}**"
            echo "- tests: **${{ steps.tests.outcome }}**"
            echo ""
            echo "MLX is pinned to the CPU device here — GitHub's macOS runners"
            echo "have paravirtualised Metal, where MLX GPU work aborts."
            echo "See [PARITY.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/PARITY.md)."
          } >> "$GITHUB_STEP_SUMMARY"
