[package]
name = "mlx-whisper-rs"
version = "0.1.0"
edition = "2024"
description = "MLX-accelerated Whisper speech recognition for Apple Silicon"
authors = ["Chris Liu <chrisliuqq@gmail.com>", "Aurel Canciu <aurelcanciu@gmail.com>"]
repository = "https://github.com/relu/mlx-whisper-rs"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
mlx-rs = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
anyhow = "1"
base64 = "0.22"
once_cell = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The `zlib` backend links C zlib, which is what CPython's `zlib` module uses.
# flate2's default miniz_oxide backend is not byte-identical at the same level,
# and `compression_ratio` feeds a hard 2.4 threshold, so a few bytes of
# difference flips the temperature-fallback decision on borderline segments.
flate2 = { version = "1", default-features = false, features = ["zlib"] }

[dev-dependencies]
hound = "3"
