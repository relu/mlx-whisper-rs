[package]
name = "mlx-whisper-rs"
version = "0.1.0"
edition = "2024"
description = "MLX-accelerated Whisper speech recognition for Apple Silicon"
authors = ["Chris Liu <chrisliuqq@gmail.com>", "Aurel Canciu <aurelcanciu@gmail.com>"]
repository = "https://github.com/relu/mlx-whisper-rs"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
mlx-rs = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
anyhow = "1"
base64 = "0.22"
once_cell = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The `zlib` backend links C zlib, which is what CPython's `zlib` module uses.
# flate2's default miniz_oxide backend is not byte-identical at the same level,
# and `compression_ratio` feeds a hard 2.4 threshold, so a few bytes of
# difference flips the temperature-fallback decision on borderline segments.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
# Not used directly; declared only to turn on `static` for the copy of
# `libz-sys` that flate2's `zlib` backend pulls in. Without it `libz-sys` runs
# a pkg-config probe and links `-lz` dynamically, which resolves to the
# system `/usr/lib/libz.1.dylib` on a clean machine but to
# `/opt/homebrew/opt/zlib/lib/libz.dylib` if `PKG_CONFIG_PATH` happens to
# point at the keg. With `static` it skips pkg-config entirely and compiles
# the vendored stock zlib sources, so the deflate output stays byte-identical
# to CPython's and the binary gains no Homebrew dylib. Note that
# `LIBZ_SYS_STATIC=0` in the environment still overrides this feature.
libz-sys = { version = "1", features = ["static"] }
# tiktoken's pre-tokenization pattern keys on `\p{L}` and `\p{N}`, the raw
# Unicode *general categories*. `char::is_alphabetic` is the derived
# `Alphabetic` property instead — wider by `Nl` and `Other_Alphabetic`, which
# covers Indic combining vowel signs — so it splits `कि` differently from
# tiktoken and yields different token ids.
unicode-general-category = "1.1.0"

[dev-dependencies]
hound = "3"
